name: build guhcampos.github.io

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [resume-schema-change]

permissions:
  contents: read
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GUHCAMPOS_OBSIDIAN_VAULT_ROOT: ${{ github.workspace }}/obsidian-vault
      GUHCAMPOS_SPOTIFY_CLIENT_ID: ${{ secrets.GUHCAMPOS_SPOTIFY_CLIENT_ID }}
      GUHCAMPOS_SPOTIFY_CLIENT_SECRET: ${{ secrets.GUHCAMPOS_SPOTIFY_CLIENT_SECRET }}
      GUHCAMPOS_SPOTIFY_USER_ID: ${{ secrets.GUHCAMPOS_SPOTIFY_USER_ID }}
      HUGO_VERSION: 0.148.1
    steps:
      - name: checkout website repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: checkout obsidian vault
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.OBSIDIAN_VAULT }}
          ssh-key: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
          path: build/obsidian-vault
          fetch-depth: 1

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: install python
        run: uv python install

      - name: install hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: copy obsidian content
        run: uv run guhcampos obsidian pull
      - name: fetch spotify playlists
        run: uv run guhcampos spotify fetch-playlists

      - name: render resume page from schema
        working-directory: resume-compiler
        run: |
          PYTHONPATH=src uv run --no-project \
            --with 'pyyaml>=6' --with 'jinja2>=3.1' \
            python render_page.py \
            --schema schema.yaml \
            --output ../hugo/static/resume/index.html

      - name: build website
        run: uv run guhcampos hugo build

      - name: commit regenerated resume page
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hugo/static/resume/index.html
          if git diff --cached --quiet; then
            echo "resume page unchanged"
          else
            git commit -m "resume: regenerate index.html from schema (deterministic render)"
            git push
          fi

      - name: setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
